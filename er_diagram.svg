<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1250" font-family="Arial, sans-serif" style="background:white">
  <!-- ============ ALL CONNECTION LINES ============ -->
  <g stroke="black" stroke-width="1.5" fill="none">
    <!-- Season attrs -->
    <line x1="140" y1="50" x2="215" y2="80"/>
    <line x1="280" y1="40" x2="280" y2="75"/>
    <line x1="420" y1="50" x2="345" y2="80"/>

    <!-- Team attrs -->
    <line x1="50" y1="410" x2="120" y2="475"/>
    <line x1="50" y1="480" x2="120" y2="500"/>
    <line x1="50" y1="550" x2="120" y2="530"/>
    <line x1="50" y1="620" x2="120" y2="555"/>
    <line x1="170" y1="630" x2="170" y2="555"/>
    <line x1="300" y1="580" x2="220" y2="540"/>
    <line x1="300" y1="510" x2="220" y2="510"/>

    <!-- Driver attrs -->
    <line x1="560" y1="140" x2="680" y2="210"/>
    <line x1="650" y1="115" x2="710" y2="210"/>
    <line x1="740" y1="100" x2="740" y2="205"/>
    <line x1="830" y1="115" x2="780" y2="210"/>
    <line x1="920" y1="145" x2="805" y2="210"/>
    <line x1="930" y1="220" x2="805" y2="230"/>
    <line x1="890" y1="290" x2="790" y2="255"/>
    <line x1="740" y1="330" x2="740" y2="255"/>
    <line x1="580" y1="300" x2="690" y2="255"/>

    <!-- Race attrs -->
    <line x1="570" y1="810" x2="680" y2="855"/>
    <line x1="570" y1="880" x2="680" y2="870"/>
    <line x1="570" y1="945" x2="680" y2="895"/>
    <line x1="740" y1="970" x2="740" y2="900"/>
    <line x1="910" y1="940" x2="800" y2="895"/>
    <line x1="910" y1="865" x2="800" y2="870"/>

    <!-- RaceResult attrs -->
    <line x1="1570" y1="380" x2="1475" y2="490"/>
    <line x1="1580" y1="440" x2="1475" y2="510"/>
    <line x1="1580" y1="500" x2="1475" y2="520"/>
    <line x1="1580" y1="560" x2="1475" y2="540"/>
    <line x1="1570" y1="620" x2="1475" y2="555"/>
    <line x1="1520" y1="680" x2="1440" y2="555"/>
    <line x1="1370" y1="680" x2="1390" y2="555"/>

    <!-- IngestionMeta attrs -->
    <line x1="60" y1="1030" x2="120" y2="1060"/>
    <line x1="170" y1="1020" x2="170" y2="1055"/>
    <line x1="290" y1="1035" x2="230" y2="1060"/>

    <!-- StandingsCache attrs -->
    <line x1="1280" y1="975" x2="1340" y2="1025"/>
    <line x1="1400" y1="960" x2="1400" y2="1020"/>
    <line x1="1520" y1="975" x2="1460" y2="1025"/>
    <line x1="1550" y1="1050" x2="1490" y2="1050"/>

    <!-- Entity-to-Relationship lines -->
    <!-- Team → has -->
    <line x1="170" y1="475" x2="370" y2="380"/>
    <!-- has → Driver -->
    <line x1="490" y1="375" x2="680" y2="255"/>
    <!-- Driver → achieves -->
    <line x1="805" y1="240" x2="1000" y2="375"/>
    <!-- achieves → RaceResult -->
    <line x1="1130" y1="380" x2="1325" y2="500"/>
    <!-- Team → fields -->
    <line x1="220" y1="520" x2="710" y2="555"/>
    <!-- fields → RaceResult -->
    <line x1="830" y1="550" x2="1325" y2="530"/>
    <!-- Race → produces -->
    <line x1="800" y1="855" x2="1000" y2="710"/>
    <!-- produces → RaceResult -->
    <line x1="1130" y1="700" x2="1325" y2="555"/>
  </g>

  <!-- ============ ENTITY RECTANGLES ============ -->
  <g stroke="black" stroke-width="2" fill="white">
    <rect x="215" y="75" width="130" height="40" />
    <rect x="120" y="475" width="100" height="55" />
    <rect x="680" y="205" width="120" height="50" />
    <rect x="680" y="850" width="120" height="50" />
    <rect x="1325" y="490" width="150" height="55" />
    <rect x="85" y="1055" width="170" height="40" />
    <rect x="1310" y="1025" width="180" height="45" />
  </g>
  <!-- Entity labels -->
  <g fill="black" font-size="14" font-weight="bold" text-anchor="middle">
    <text x="280" y="100">Season</text>
    <text x="170" y="509">Team</text>
    <text x="740" y="236">Driver</text>
    <text x="740" y="881">Race</text>
    <text x="1400" y="524">RaceResult</text>
    <text x="170" y="1080">IngestionMeta</text>
    <text x="1400" y="1053">StandingsCache</text>
  </g>

  <!-- ============ RELATIONSHIP DIAMONDS ============ -->
  <!-- Diamond: "has" center (430, 370) -->
  <polygon points="365,370 430,335 495,370 430,405" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="430" y="376" text-anchor="middle" fill="black" font-size="13">has</text>

  <!-- Diamond: "achieves" center (1065, 380) -->
  <polygon points="990,380 1065,340 1140,380 1065,420" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="1065" y="386" text-anchor="middle" fill="black" font-size="13">achieves</text>

  <!-- Diamond: "fields" center (770, 550) -->
  <polygon points="710,550 770,518 830,550 770,582" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="770" y="556" text-anchor="middle" fill="black" font-size="12">fields</text>

  <!-- Diamond: "produces" center (1065, 705) -->
  <polygon points="990,705 1065,665 1140,705 1065,745" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="1065" y="712" text-anchor="middle" fill="black" font-size="13">produces</text>

  <!-- ============ ATTRIBUTE OVALS ============ -->
  <g stroke="black" stroke-width="1.2" fill="white" font-size="12" text-anchor="middle">
    <!-- Season attrs -->
    <ellipse cx="140" cy="45" rx="42" ry="17"/><text x="140" y="50" fill="black" text-decoration="underline">year</text>
    <ellipse cx="280" cy="30" rx="50" ry="17"/><text x="280" y="35" fill="black">is_active</text>
    <ellipse cx="420" cy="45" rx="55" ry="17"/><text x="420" y="50" fill="black">created_at</text>

    <!-- Team attrs -->
    <ellipse cx="50" cy="405" rx="32" ry="17"/><text x="50" y="410" fill="black" text-decoration="underline">id</text>
    <ellipse cx="50" cy="475" rx="68" ry="17"/><text x="50" y="480" fill="black">constructor_id</text>
    <ellipse cx="50" cy="545" rx="42" ry="17"/><text x="50" y="550" fill="black">name</text>
    <ellipse cx="50" cy="615" rx="38" ry="17"/><text x="50" y="620" fill="black">color</text>
    <ellipse cx="170" cy="625" rx="55" ry="17"/><text x="170" y="630" fill="black">nationality</text>
    <ellipse cx="300" cy="575" rx="50" ry="17"/><text x="300" y="580" fill="black">principal</text>
    <ellipse cx="300" cy="505" rx="38" ry="17"/><text x="300" y="510" fill="black">base</text>

    <!-- Driver attrs -->
    <ellipse cx="560" cy="135" rx="32" ry="17"/><text x="560" y="140" fill="black" text-decoration="underline">id</text>
    <ellipse cx="650" cy="110" rx="38" ry="17"/><text x="650" y="115" fill="black">code</text>
    <ellipse cx="740" cy="95" rx="45" ry="17"/><text x="740" y="100" fill="black">number</text>
    <ellipse cx="830" cy="110" rx="55" ry="17"/><text x="830" y="115" fill="black">first_name</text>
    <ellipse cx="920" cy="140" rx="52" ry="17"/><text x="920" y="145" fill="black">last_name</text>
    <ellipse cx="930" cy="215" rx="35" ry="17"/><text x="930" y="220" fill="black">dob</text>
    <ellipse cx="890" cy="285" rx="55" ry="17"/><text x="890" y="290" fill="black">nationality</text>
    <ellipse cx="740" cy="325" rx="62" ry="17"/><text x="740" y="330" fill="black">headshot_url</text>
    <ellipse cx="580" cy="295" rx="55" ry="17"/><text x="580" y="300" fill="black">created_at</text>

    <!-- Race attrs -->
    <ellipse cx="570" cy="805" rx="32" ry="17"/><text x="570" y="810" fill="black" text-decoration="underline">id</text>
    <ellipse cx="570" cy="875" rx="45" ry="17"/><text x="570" y="880" fill="black">season</text>
    <ellipse cx="570" cy="940" rx="42" ry="17"/><text x="570" y="945" fill="black">round</text>
    <ellipse cx="740" cy="965" rx="42" ry="17"/><text x="740" y="970" fill="black">name</text>
    <ellipse cx="910" cy="935" rx="62" ry="17"/><text x="910" y="940" fill="black">circuit_name</text>
    <ellipse cx="910" cy="860" rx="38" ry="17"/><text x="910" y="865" fill="black">date</text>

    <!-- RaceResult attrs -->
    <ellipse cx="1570" cy="375" rx="32" ry="17"/><text x="1570" y="380" fill="black" text-decoration="underline">id</text>
    <ellipse cx="1580" cy="435" rx="48" ry="17"/><text x="1580" y="440" fill="black">position</text>
    <ellipse cx="1580" cy="495" rx="42" ry="17"/><text x="1580" y="500" fill="black">points</text>
    <ellipse cx="1580" cy="555" rx="35" ry="17"/><text x="1580" y="560" fill="black">grid</text>
    <ellipse cx="1570" cy="615" rx="42" ry="17"/><text x="1570" y="620" fill="black">status</text>
    <ellipse cx="1520" cy="675" rx="75" ry="17"/><text x="1520" y="680" fill="black">fastest_lap_time</text>
    <ellipse cx="1370" cy="675" rx="72" ry="17"/><text x="1370" y="680" fill="black">fastest_lap_rank</text>

    <!-- IngestionMeta attrs -->
    <ellipse cx="60" cy="1025" rx="35" ry="17"/><text x="60" y="1030" fill="black" text-decoration="underline">key</text>
    <ellipse cx="170" cy="1015" rx="40" ry="17"/><text x="170" y="1020" fill="black">value</text>
    <ellipse cx="290" cy="1030" rx="55" ry="17"/><text x="290" y="1035" fill="black">updated_at</text>

    <!-- StandingsCache attrs -->
    <ellipse cx="1280" cy="970" rx="45" ry="17"/><text x="1280" y="975" fill="black" text-decoration="underline">season</text>
    <ellipse cx="1400" cy="955" rx="35" ry="17"/><text x="1400" y="960" fill="black" text-decoration="underline">type</text>
    <ellipse cx="1520" cy="970" rx="45" ry="17"/><text x="1520" y="975" fill="black">payload</text>
    <ellipse cx="1550" cy="1045" rx="58" ry="17"/><text x="1550" y="1050" fill="black">computed_at</text>
  </g>

  <!-- ============ CARDINALITY LABELS ============ -->
  <g fill="black" font-size="14" font-weight="bold">
    <!-- Team(1) → has → Driver(N) -->
    <text x="220" y="460">1</text>
    <text x="600" y="270">N</text>
    <!-- Driver(1) → achieves → RaceResult(N) -->
    <text x="840" y="260">1</text>
    <text x="1230" y="460">N</text>
    <!-- Team(1) → fields → RaceResult(N) -->
    <text x="280" y="540">1</text>
    <text x="1260" y="540">N</text>
    <!-- Race(1) → produces → RaceResult(N) -->
    <text x="840" y="840">1</text>
    <text x="1230" y="620">N</text>
  </g>

  <!-- Title -->
  <text x="900" y="1220" text-anchor="middle" fill="black" font-size="16" font-weight="bold" letter-spacing="2">
    RaceDelta — Entity Relationship Diagram
  </text>
</svg>
